name: Release DevMentor

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version to release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: Stable MAJOR.MINOR.PATCH version; only used with custom
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: devmentor-release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLATFORM_CURRENCY: "PLN"
  PLATFORM_PRICE_BOUNDS: '{"25":{"minCents":9000,"maxCents":60000},"50":{"minCents":18000,"maxCents":120000}}'

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Run releases from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --include=optional

      - name: Prepare version and release notes
        id: release
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          current_version=$(node -p "require('./package.json').version")
          version=$(node scripts/release/release.mjs resolve "$VERSION_BUMP" "$CUSTOM_VERSION")
          tag="v$version"
          notes_file="$RUNNER_TEMP/release-notes.md"
          node scripts/release/release.mjs notes "$version" "$notes_file"

          remote_tags=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          recovery=false
          if [ -n "$remote_tags" ]; then
            if [ "$version" != "$current_version" ]; then
              echo "Tag $tag already exists and cannot be moved." >&2
              exit 1
            fi
            tag_commit=$(printf '%s\n' "$remote_tags" | awk '$2 ~ /\^\{\}$/ { print $1; found=1 } END { if (!found && NR == 1) print $1 }')
            if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $tag does not point at the current default-branch commit." >&2
              exit 1
            fi
            recovery=true
          elif [ "$version" != "$current_version" ]; then
            npm version "$version" --workspaces --include-workspace-root --no-git-tag-version --ignore-scripts
            node scripts/release/release.mjs verify "$version"
            expected_files=$(node scripts/release/release.mjs files)
            changed_files=$(git diff --name-only | sort)
            if [ "$changed_files" != "$expected_files" ]; then
              echo "Versioning changed files outside the expected manifests and lockfile." >&2
              diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$changed_files") || true
              exit 1
            fi
          fi

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
      - name: Typecheck application and packages
        run: npm run typecheck
      - name: Typecheck Storybook
        run: npm run typecheck:storybook
      - name: Typecheck prototype
        run: npm run typecheck:prototype
      - name: Build Storybook
        run: npm run build-storybook
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:unit:coverage
      - name: Prototype tests
        run: npm run test:prototype
      - name: Install integration-test browser
        run: npm run test:browser:install:ci
      - name: Integration tests
        env:
          OPERATOR_EMAILS: mock-operator@devmentor.test
        run: npm run test:integration

      - name: Create release commit and annotated tag
        if: steps.release.outputs.recovery != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/release.mjs verify "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add --pathspec-from-file=<(node scripts/release/release.mjs files)
            git commit -m "chore(release): $TAG"
          fi
          test -z "$(git status --porcelain)"
          node scripts/release/release.mjs verify "$VERSION"
          git tag --annotate "$TAG" --message "DevMentor $VERSION"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"

      - name: Publish tag and GitHub Release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          RECOVERY: ${{ steps.release.outputs.recovery }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/existing-release.json"
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          case "$status" in
            200)
              echo "GitHub Release $TAG already exists." >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "GitHub Release lookup failed with HTTP $status." >&2
              exit 1
              ;;
          esac

          if [ "$RECOVERY" = "true" ]; then
            remote_commit=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')
            if [ -z "$remote_commit" ]; then
              remote_commit=$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')
            fi
            test "$remote_commit" = "$(git rev-parse HEAD)"
          else
            askpass="$RUNNER_TEMP/git-askpass.sh"
            printf '%s\n' '#!/bin/sh' 'case "$1" in' '*Username*) printf %s x-access-token ;;' '*) printf %s "$GH_TOKEN" ;;' 'esac' > "$askpass"
            chmod 700 "$askpass"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push --atomic \
              "https://github.com/$GITHUB_REPOSITORY.git" \
              HEAD:"refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"
          fi

          gh release create "$TAG" --verify-tag --target "$(git rev-parse HEAD)" \
            --title "DevMentor $VERSION" --notes-file "$NOTES_FILE"

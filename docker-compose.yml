services:
  postgres:
    image: postgres:17-alpine
    container_name: devmentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - devmentor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor -d devmentor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devmentor_pgdata:
